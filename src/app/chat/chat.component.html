  <ion-split-pane contentId="main-content">
          <ion-menu contentId="main-content" type="overlay">
            <ion-content fullscreen [scrollY]="false">
              <ion-grid class="h-100">
                <ion-row class="h-100">

                  <ion-col id="side-menu" sizeSm="2" class="d-flex flex-column justify-content-end align-items-center">
                    <ion-segment [(ngModel)]="selectedPage" class="d-flex flex-column align-items-center justify-content-center">
                      @for(option of options; track  $index){
                        <ion-segment-button [value]="option[0]" class="d-flex align-items-center justify-content-center">
                          <fa-icon [icon]="option[1]" size="lg"></fa-icon>
                        </ion-segment-button>
                      }
                      <ion-segment-button value="Profile">
                        <ion-avatar class="d-flex justify-content-center align-items-center">
                          <img class="h-50 w-50" [src]="profile.image" [alt]="Defaults.avatar">
                        </ion-avatar>
                      </ion-segment-button>
                    </ion-segment>
                  </ion-col>


                  <ion-col sizeSm="10">
                    @if (loading) {
                      <ion-loading></ion-loading>
                    }
                    @else {
                      @switch (selectedPage){
                        @case ('Creation'){
                          <app-creation-menu (chatEvent)="changeSelectedChat($event)"/>
                        }
                        @case ('Friends'){
                          <app-friends-menu/>
                        }
                        @case ('Profile'){
                          <app-profile-menu/>
                        }
                        @case ('List'){
                          <app-main-menu (selectedChatChanged)="changeSelectedChat($event)"/>
                        }
                        @default {
                        }
                      }
                    }
                  </ion-col>

                </ion-row>
              </ion-grid>
            </ion-content>
          </ion-menu>
    <ion-content>
      <app-chat-main-content id="main-content" [chat]="selectedChat"/>
    </ion-content>

  </ion-split-pane>
